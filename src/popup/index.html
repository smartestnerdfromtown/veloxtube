<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="color-scheme" content="dark" />
        <title>VeloxTube</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <h1>VeloxTube</h1>
        <h2>Masthead</h2>
        <label>
            <span>Top Logo</span>
            <input id="topLogoEnabled" type="checkbox" />
        </label>
        <label>
            <span>Notification Bell</span>
            <input id="notificationBellEnabled" type="checkbox" />
        </label>
        <label>
            <span>Mic Button</span>
            <input id="micButtonEnabled" type="checkbox" />
        </label>
        <hr />
        <h2>Home Feed</h2>
        <label>
            <span>Home Shorts</span>
            <input id="homeShortsEnabled" type="checkbox" />
        </label>
        <hr />
        <h2>Search Feed</h2>
        <label>
            <span>Search Shorts</span>
            <input id="searchShortsEnabled" type="checkbox" />
        </label>
        <hr />
        <h2>Video Feed</h2>
        <label>
            <span>Join Button</span>
            <input id="videoJoinButtonEnabled" type="checkbox" />
        </label>
        <label>
            <span>Thanks Button</span>
            <input id="videoThanksButtonEnabled" type="checkbox" />
        </label>

        <hr />
        <h2>Channel</h2>
        <label>
            <span>Join Button</span>
            <input id="channelJoinButtonEnabled" type="checkbox" />
        </label>
        <hr />
        <h2>Feeds</h2>
        <label>
            <span>Topic Bar</span>
            <input id="topicBarEnabled" type="checkbox" />
        </label>
        <label>
            <span>In-Feed Ads</span>
            <input id="inFeedAdsEnabled" type="checkbox" />
        </label>
        <hr />
        <h2>Sidebar</h2>
        <label>
            <span>Sidebar Shorts</span>
            <input id="sidebarShortsEnabled" type="checkbox" />
        </label>
        <label>
            <span>Sidebar Footer</span>
            <input id="sidebarFooterEnabled" type="checkbox" />
        </label>
        <label>
            <span>More from YouTube</span>
            <input id="moreFromYouTubeEnabled" type="checkbox" />
        </label>
        <label>
            <span>Explore Menu</span>
            <input id="exploreMenuEnabled" type="checkbox" />
        </label>
        <script src="index.js"></script>
    </body>
</html>
